# Gold query set, version 1.
#
# Hand-authored and reviewed, like configs/corpus.yaml: never rewritten by
# tooling, so these comments and per-entry justifications survive.
#
# Evidence is (doc_id, page, modality). Not chunk_id -- those are namespaced per
# method and hashed over content, so the two methods hold different ids for the
# same evidence and could not be compared. Not element_id -- those encode a
# per-type-per-page ordinal that shifts whenever detection changes, and this
# corpus has been re-ingested three times already.
#
# Two axes, kept separate on purpose:
#   stratum   how the question is PHRASED  (text | table | figure | natural)
#   requires  where the answer LIVES       (text | table | figure)
# A naturally phrased question about a table is stratum=natural, requires=table.
# The router audit found explicit modality words hand the router its answer, so
# `natural` is the honest slice and must be reported separately.
#
# Every `note` records how the page was verified. Entries confirmed by matching
# chunk text in the built index are stated plainly; anything inferred from a
# section heading, or where an adjacent page could equally qualify, is marked
# NEEDS REVIEW.
#
# Known bias, applying equally to both methods: page-level evidence slightly
# over-credits. A chunk from the right page and modality counts as a hit even if
# it is not the exact sentence carrying the answer. A (doc, page, modality) key
# selects 2.09 chunks on average, 1.36 for figures.
#
# Validate with:  mmrag eval validate

version: 1
description: >
  Retrieval gold set for the Method 1 vs Method 2 comparison. 40 queries across
  four phrasing strata over all 14 corpus documents, with evidence at
  (doc_id, page, modality) granularity.

# SHA-256 of configs/corpus.lock.yaml when this set was authored. Page numbers
# are only meaningful against the corpus they were read from.
corpus_lock_sha256: null

queries:

  # =======================================================================
  # stratum: text -- prose questions, answer lives in prose (10)
  # =======================================================================

  - id: q001
    query: What is positional encoding and why is it needed?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_attention
        page: 6
        modality: text
        note: >
          Section 3.5 "Positional Encoding". Confirmed: the p6 text chunk
          carries the section heading and the PE( sine/cosine formulation.

  - id: q002
    query: Why does ColPali use late interaction instead of a single dense vector?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_colpali
        page: 3
        modality: text
        note: >
          Reviewed and confirmed. p3 is the minimal sufficient evidence: it
          gives the motivation for late interaction, contrasts it with
          single-vector bi-encoder retrieval, and states the benefit of
          fine-grained query-document term interaction.
    notes: >
      The p1 abstract was originally listed as a second evidence page and was
      removed on review as redundant -- it asserts the late-interaction claim
      without explaining it, so crediting it would reward retrieving the
      weaker of the two pages.

  - id: q003
    query: How does retrieval-augmented generation combine parametric and non-parametric memory?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_rag
        page: 1
        modality: text
        note: >
          Confirmed: p1 text chunk describes combining a pre-trained
          seq2seq (parametric) with a retrieved passage index
          (non-parametric), including the per-token variant.

  - id: q004
    query: What is systems engineering according to the NASA handbook?
    stratum: text
    requires: text
    evidence:
      - doc_id: nasa_seh
        page: 13
        modality: text
        note: >
          Confirmed: p13 text chunk in section "2.0 Fundamentals of Systems
          Engineering" defines SE as balancing design against opposing
          interests and conflicting constraints.

  - id: q005
    query: Why is the RP2040 chip called RP2040?
    stratum: text
    requires: text
    evidence:
      - doc_id: rp2040_datasheet
        page: 9
        modality: text
        note: >
          Confirmed: p9 text chunk in "Chapter 1. Introduction" contains the
          heading "1.1. Why is the chip called RP2040?" and the post-fix
          numeral explanation.

  - id: q006
    query: Explain how insurance float contributes to Berkshire's growth.
    stratum: text
    requires: text
    evidence:
      - doc_id: berkshire_ar_2023
        page: 16
        modality: text
        note: >
          Confirmed: p16 text chunk states property-casualty insurance
          "provides the core of Berkshire's well-being and growth" and
          discusses loss payments and inflation.

  - id: q007
    query: What does the IPCC say about human influence on the climate system?
    stratum: text
    requires: text
    evidence:
      - doc_id: ipcc_ar6_wg1_spm
        page: 4
        modality: text
        note: >
          Confirmed: p4 text chunk in "A. The Current State of the Climate"
          carries the headline attribution statement and its confidence
          qualifier.

  - id: q008
    query: What problem does TAPAS address in table parsing?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_tapas
        page: 1
        modality: text
        note: >
          Re-verified against the corrected corpus. The p1 abstract states the
          problem explicitly: "Answering natural language questions over tables
          is usually seen as a semantic parsing task. To alleviate the
          collection cost of full logical forms, one popular approach focuses
          on weak supervision consisting of denotations instead of logical
          forms. However, training semantic parsers from weak supervision poses
          difficulties..." The introduction on the same page restates it.
    notes: >
      This entry was previously marked NEEDS REVIEW because the evidence did
      not support the query. The cause was not the annotation: configs/corpus.yaml
      paired the TAPAS title with arXiv 2004.08483, which is a different paper
      ("ETC: Encoding Long and Structured Inputs in Transformers"), so the
      corpus contained no TAPAS paper and the question was unanswerable. The
      manifest url was corrected to 2004.02349 and the document re-ingested;
      the page number is unchanged at 1 only by coincidence.

  - id: q009
    query: Summarise the situation reported in the first WHO novel coronavirus report.
    stratum: text
    requires: text
    evidence:
      - doc_id: who_covid_sitrep_001
        page: 1
        modality: text
        note: >
