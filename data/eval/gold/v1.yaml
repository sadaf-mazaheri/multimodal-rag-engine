# Gold query set, version 1 -- SEED. Not yet the full ~40 queries.
#
# Hand-authored and reviewed, like configs/corpus.yaml: never rewritten by
# tooling, so these comments and per-entry justifications survive.
#
# Evidence is (doc_id, page, modality). Not chunk_id -- those are namespaced per
# method and hashed over content, so the two methods have different ids for the
# same evidence and could not be compared. Not element_id -- those encode a
# per-type-per-page ordinal that shifts whenever detection changes, and this
# corpus has been re-ingested three times already.
#
# Every `note` records how the page was verified, so a reviewer can check an
# entry without opening the PDF. Entries below were confirmed against the built
# index by matching chunk text, not from memory.
#
# Known bias, applying equally to both methods: page-level evidence slightly
# over-credits. A chunk from the right page and modality counts as a hit even
# if it is not the exact sentence carrying the answer. A (doc, page, modality)
# key selects 2.09 chunks on average, 1.36 for figures.
#
# Validate with:  mmrag eval validate

version: 1
description: >
  Seed slice of the retrieval gold set: two queries per stratum, spanning the
  text/table/figure modalities and both explicit and natural phrasing. Extended
  to ~40 queries once the structure is approved.

# SHA-256 of configs/corpus.lock.yaml when this set was authored. Page numbers
# are only meaningful against the corpus they were read from.
corpus_lock_sha256: null

queries:

  # --- stratum: text ------------------------------------------------------
  # Prose questions. The router should keep these to the text retrievers.

  - id: q001
    query: What is positional encoding and why is it needed?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_attention
        page: 6
        modality: text
        note: >
          Section 3.5 "Positional Encoding", which states the sine/cosine
          formulation. Confirmed: the p6 text chunk carries the section heading
          and the PE( formula.
    notes: Plain definitional question; no modality word in the query.

  - id: q002
    query: Why does ColPali use late interaction instead of a single dense vector?
    stratum: text
    requires: text
    evidence:
      - doc_id: arxiv_colpali
        page: 4
        modality: text
        note: >
          Method section contrasting late interaction with single-vector
          retrieval. NEEDS REVIEW -- page located by section heading, not by a
          verbatim sentence match.
    notes: Conceptual "why" question; the router's _is_clearly_textual should fire.

  # --- stratum: table -----------------------------------------------------
  # The query names a table explicitly, so the router gets a free signal.
  # Reported separately from `natural` for exactly that reason.

  - id: q003
    query: Which table reports the BLEU scores for the Transformer model variations?
    stratum: table
    requires: table
    evidence:
      - doc_id: arxiv_attention
        page: 9
        modality: table
        note: >
          Table 3 "Variations on the Transformer architecture", section 6.2
          Model Variations. Confirmed: the p9 table chunk matches /BLEU/.
    notes: Explicit "which table" phrasing.

  - id: q004
    query: Which table lists confirmed novel coronavirus cases by country?
    stratum: table
    requires: table
    evidence:
      - doc_id: who_covid_sitrep_001
        page: 2
        modality: table
        note: >
          Table 1 under "Situation update:". Confirmed: the p2 table chunk
          carries the "Table 1." caption.
    notes: Explicit table phrasing over the smallest corpus document.

  # --- stratum: figure ----------------------------------------------------
  # The query names a figure or diagram explicitly.

  - id: q005
    query: What does the Transformer model architecture diagram show?
    stratum: figure
    requires: figure
    evidence:
      - doc_id: arxiv_attention
        page: 3
        modality: figure
        note: >
          Figure 1 "The Transformer - model architecture", section 3 Model
          Architecture. Confirmed: the only figure chunk on p3.
    notes: >
      The query used throughout the fusion investigation. Also the one the
      MetadataResolver defect narrows to nvidia_ampere_wp on the word
      "architecture" -- expect Method 2 to miss this until that is fixed.

  - id: q006
    query: Which figure illustrates the MIG multi-instance GPU architecture?
    stratum: figure
    requires: figure
    evidence:
      - doc_id: nvidia_ampere_wp
        page: 47
        modality: figure
        note: >
          Figure under "MIG (Multi-Instance GPU) Architecture". Confirmed: p47
          figure chunk carries the section breadcrumb and a "Figure" caption.
      - doc_id: nvidia_ampere_wp
        page: 48
        modality: figure
        note: >
          Continuation of the same MIG architecture illustration. NEEDS REVIEW
          -- two adjacent pages both carry MIG figures; either may be the one a
          reader means.
    notes: Multi-evidence query; tests that recall counts distinct pages.

  # --- stratum: natural ---------------------------------------------------
  # Phrased the way a user actually asks, with no modality word. This is the
  # honest slice: the router audit found 23/25 such queries fall back and fan
  # out, so a number pooled across strata flatters the router.

  - id: q007
    query: How does an A100 partition its compute between workloads?
    stratum: natural
    requires: figure
    evidence:
      - doc_id: nvidia_ampere_wp
        page: 47
        modality: figure
        note: >
          Same MIG architecture figure as q006, reached without naming a
          figure. Confirmed alongside q006.
    notes: >
      Figure-borne answer, natural phrasing. The pair (q006, q007) isolates the
      cost of the router having no modality cue.

  - id: q008
    query: How much warming is projected under the high emissions scenario?
    stratum: natural
    requires: figure
    evidence:
      - doc_id: ipcc_ar6_wg1_spm
        page: 16
        modality: figure
        note: >
          Box SPM.1 scenario figure under "B. Possible Climate Futures".
          Confirmed: p16 figure chunk matches /scenario/. NEEDS REVIEW -- SPM.8
          on p22 also carries projected-warming indicators and may belong here
          as a second evidence page.
    notes: >
      Known hard case: the cross-encoder scores this chart below prose because
      its OCR text is thin. Recorded in docs/architecture.md as a content
      limitation rather than a fusion one.
