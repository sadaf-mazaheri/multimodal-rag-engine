  # --- natural, answer in a figure (5) ---

  - id: q036
    query: How does an A100 partition its compute between workloads?
    stratum: natural
    requires: figure
    evidence:
      - doc_id: nvidia_ampere_wp
        page: 47
        modality: figure
        note: >
          Reviewed and kept as the primary evidence. The p47 figure is the one
          that maps *workloads* onto hardware: its OCR text runs USER0..USER4
          against GPUInstance0..GPUInstance3, which is exactly what "partition
          its compute between workloads" asks for. p48/Figure 22 shows the
          internal slice composition of three GPU Instances but no workloads at
          all.
      - doc_id: nvidia_ampere_wp
        page: 48
        modality: figure
        note: >
          Kept as secondary: "Figure 22. Example MIG compute configuration"
          under "MIG Architecture and GPU Instances in Detail" also answers the
          question, one level lower.
    notes: >
      q020 and q036 are deliberately NOT a strict same-evidence pair, and
      should not be treated as one. They were originally built that way so the
      only difference would be phrasing, but the two questions turn out to want
      different pages: q020 asks which figure illustrates the MIG architecture,
      answered precisely by p48/Figure 22, while q036 asks how compute is
      partitioned between workloads, answered more directly by p47. Intent was
      preferred over the tidiness of the ablation.

      Worth knowing when reading a miss here: the p47 chunk's caption reads
      "Figure 20. CSP Multi-user node Today" while its OCR content is the MIG
      diagram, so caption and image disagree on that page and a lexical
      retriever sees misleading text. An ingestion observation, not something
      this gold set tries to correct.

