  # =======================================================================
  # stratum: natural -- no modality word; the honest slice (14)
  # Reported separately, because the router only discriminates on explicit
  # cues and these are the queries a user would actually type.
  # =======================================================================

  # --- natural, answer in prose (5) ---

  - id: q027
