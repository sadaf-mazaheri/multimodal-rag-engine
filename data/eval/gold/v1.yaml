          where the text is baked into the image and was recovered by OCR.
    notes: >
      Corrected during verification: originally labelled requires=text on the
      assumption that a sentence like this lives in prose. It does not. This is
      now one of the most interesting queries in the set -- a figure-borne
      answer that only became retrievable at all once OCR ran, and that Method
      1 would have missed entirely before then.

  - id: q028
