[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrag"
version = "0.1.0"
description = "A production-grade benchmark comparing three multimodal RAG architectures on the same document corpus."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sadaf" }]

dependencies = [
    # --- core / config / cli ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    # --- document parsing ---
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    # --- retrieval / embeddings (provider-independent, local models) ---
    "numpy>=1.26",
    "scipy>=1.11",
    "sentence-transformers>=3.0",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    # --- stores ---
    # Kept in lockstep with the server image in docker-compose.yml.
    "qdrant-client>=1.19,<1.20",
    "psycopg[binary]>=3.1",
    # --- analysis ---
    "pandas>=2.2",
]

[project.optional-dependencies]
# Default generation provider. Kept optional so the retrieval stack can be
# installed and exercised with zero API dependencies.
openai = ["openai>=1.40"]

# OCR for text baked into figure images. rapidocr is the default backend and
# ships its ONNX models inside the wheel, so this extra alone is enough to
# reproduce an ingestion run -- no system package. pytesseract is kept for the
# alternative backend and additionally needs the Tesseract binary on PATH.
ocr = ["rapidocr-onnxruntime>=1.4,<2", "pytesseract>=0.3.10"]

# Method 3 visual retrieval. Practically requires a GPU; on a CPU-only box the
# index is built out-of-band via notebooks/colab_visual_indexing.ipynb.
visual = ["colpali-engine>=0.3", "transformers>=4.45", "accelerate>=0.33"]

# Fully offline generation via a local server (Ollama / llama.cpp / vLLM).
local = ["openai>=1.40"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.scripts]
mmrag = "mmrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
# Ligatures, curly quotes and non-breaking spaces are the *subject* of the text
# normalisation tests, so flagging them as ambiguous is exactly backwards.
"tests/test_ingestion.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
packages = ["mmrag"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires running Postgres/Qdrant services",
    "slow: downloads models or documents",
    "llm: calls a generation provider and costs money",
]
